<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sleek Expense Tracker</title>
    <!-- Keeping Bootstrap for grid/layout utility but styles are overridden -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            $('body').addClass('loaded');
            $('a').not('.no-transition').on('click', function(e) {
                var link = $(this).attr('href');
                if(link && link !== "#" && !link.startsWith("javascript")) {
                    e.preventDefault();
                    $('body').removeClass('loaded');
                    setTimeout(function() {
                        window.location.href = link;
                    }, 500);
                }
            });
        });
    </script>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="glass-container">
                <h1 class="page-title">Expense Tracker</h1>
                
                <div class="table-responsive">
                    <table class="glass-table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Description</th>
                            <th>Amount</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="expense : ${expenses}">
                            <td th:text="${expense.id}">1</td>
                            <td th:text="${expense.description}">Description</td>
                            <td th:text="'₹' + ${expense.amount}">Amount</td>
                            <td class="action-buttons">
                                <a class="btn-custom btn-sm-custom btn-primary-custom" th:href="@{/editExpense/{id}(id=${expense.id})}">
                                    <i class="fas fa-pencil-alt"></i>
                                </a>
                                <a class="btn-custom btn-sm-custom btn-danger-custom" th:href="@{/deleteExpense/{id}(id=${expense.id})}" onclick="return confirm('Are you sure you want to delete this expense?');">
                                    <i class="fas fa-trash-alt"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(expenses)}">
                            <td colspan="4" class="text-center py-4" style="color: var(--text-secondary);">No expenses found. Add some!</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="total-section">
                    <div>
                        <a class="btn-custom btn-success-custom mt-2" href="/addExpense">
                            <i class="fas fa-plus"></i> Add New Expense
                        </a>
                    </div>
                    <div>
                        <span class="total-amount-label">Total: </span>
                        <span class="total-amount" th:text="'₹' + ${totalAmount != null ? totalAmount : '0.00'}">0.00</span>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
</body>
</html>
